<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Set a Side — Crossword</title>
    <link rel="stylesheet" href="../styles.css?v=20261030-17" />
  </head>
  <body class="puzzle-page">
    <nav class="puzzle-nav" aria-label="Puzzle navigation"><a href="../index.html">← All puzzles</a></nav>
    <div id="app"></div>

    <script src="../shared/progress.js?v=20261030-17"></script>
    <script src="../shared/puzzle-app.js?v=20261030-17"></script>
    <script src="set-aside-2026-10-28.data.js?v=20261030-17"></script>
    <script src="../shared/puzzle-shell.js?v=20261030-17"></script>
    <script>
      (function () {
        var el = document.getElementById("app");
        try {
          window.mountCrosswordPuzzle(el);
        } catch (err) {
          el.textContent = "";
          var p = document.createElement("p");
          p.textContent =
            "Could not load the puzzle (" + (err && err.message ? err.message : err) + "). Check the browser console.";
          el.appendChild(p);
        }
      })();
    </script>
  </body>
</html>
